spring.application.name=config-server
server.port=8888

# Profil natif : sert les configs depuis un dossier local, pas de repo Git
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:///${user.home}/config-data-local

# Exposer le endpoint health pour le healthcheck Docker
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always