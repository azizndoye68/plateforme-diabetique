spring.application.name=auth-service
spring.config.import=${CONFIG_SERVER_IMPORT:configserver:http://localhost:8888}
spring.profiles.active=default
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_service_db}
spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.jpa.show-sql=false
logging.level.org.springframework.security=INFO
logging.level.sn.diabete.auth=INFO
logging.level.io.jsonwebtoken=WARN
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
auth.internal-api-key=${AUTH_INTERNAL_API_KEY}
